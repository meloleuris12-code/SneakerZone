<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Productos | SneakerZone</title>

    <!-- CSS general -->
    <link rel="stylesheet" href="css/style.css">

    <!-- CSS página de productos -->
    <link rel="stylesheet" href="css/productos.css">

    <!-- Fuente -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Iconos -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <!-- ================= HEADER ================= -->

    <header>

        <div class="logo">
            <h2>SneakerZone</h2>
        </div>

        <nav>
            <a href="index.html">Inicio</a>
            <a href="productos.html">Productos</a>
            <a href="marcas.html">Marcas</a>
            <a href="index.html#contacto">Contacto</a>
        </nav>

        <div class="icons">


            <a href="carrito.html">
                <i class="fa-solid fa-cart-shopping"></i>
            </a>

            <a href="#" id="enlace-usuario">
                <i class="fa-solid fa-user"></i>
            </a>
        </div>

    </header>


    <!-- ================= TÍTULO ================= -->

    <section class="encabezado-productos">

        <p>Encuentra tu próximo par</p>

        <h1>Nuestros Productos</h1>

    </section>


    <!-- ================= CONTENIDO ================= -->

    <main class="catalogo">

        <!-- ================= FILTROS ================= -->

        <aside class="filtros">

            <h2>Filtros</h2>

            <!-- FILTRO POR MARCA -->

            <div class="grupo-filtro">

                <h3>Marca</h3>

                <label>
                    <input
                        type="checkbox"
                        class="filtro-marca"
                        value="nike"
                    >
                    Nike
                </label>

                <label>
                    <input
                        type="checkbox"
                        class="filtro-marca"
                        value="jordan"
                    >
                    Jordan
                </label>

                <label>
                    <input
                        type="checkbox"
                        class="filtro-marca"
                        value="adidas"
                    >
                    Adidas
                </label>

                <label>
                    <input
                        type="checkbox"
                        class="filtro-marca"
                        value="puma"
                    >
                    Puma
                </label>

                <label>
                    <input
                        type="checkbox"
                        class="filtro-marca"
                        value="new-balance"
                    >
                    New Balance
                </label>

            </div>


            <!-- FILTRO POR TALLA -->

            <div class="grupo-filtro">

                <h3>Talla</h3>

                <select id="filtro-talla">

                    <option value="todas">
                        Todas las tallas
                    </option>

                    <option value="7">
                        7
                    </option>

                    <option value="8">
                        8
                    </option>

                    <option value="9">
                        9
                    </option>

                    <option value="10">
                        10
                    </option>

                    <option value="11">
                        11
                    </option>

                    <option value="12">
                        12
                    </option>

                </select>

            </div>

        </aside>


        <!-- ================= ÁREA DE PRODUCTOS ================= -->

        <section class="area-productos">

            <!-- BARRA DE BÚSQUEDA Y ORDEN -->

            <div class="barra-productos">

                <!-- BUSCADOR -->

                <input
                    type="search"
                    id="buscador-productos"
                    placeholder="Buscar tenis..."
                >


                <!-- ORDEN -->

                <select id="orden-productos">

                    <option value="default">
                        Ordenar por
                    </option>

                    <option value="precio-menor">
                        Precio: menor a mayor
                    </option>

                    <option value="precio-mayor">
                        Precio: mayor a menor
                    </option>

                    <option value="recientes">
                        Más recientes
                    </option>

                </select>

            </div>


            <!-- ================= GRID DE PRODUCTOS ================= -->

            <!--
                Los productos son cargados desde SQL Server
                mediante Java y JavaScript.
            -->

            <div class="grid-productos">

            </div>

        </section>

    </main>


    <!-- ================= FOOTER ================= -->

    <footer>

        <div>

            <h3>SneakerZone</h3>

            <p>
                Tu tienda especializada en tenis
                de las mejores marcas.
            </p>

        </div>


        <div>

            <h3>Enlaces</h3>

            <p>
                <a href="index.html">
                    Inicio
                </a>
            </p>

            <p>
                <a href="productos.html">
                    Productos
                </a>
            </p>

        </div>


        <div>

            <h3>Contacto</h3>

            <p>
                meloleuris12@gmail.com
            </p>

            <p>
                República Dominicana
            </p>

        </div>

    </footer>


    <!-- ================= JAVASCRIPT ================= -->

    <script src="js/productos.js"></script>
    <script src="js/index.js"></script>

</body>

</html>
